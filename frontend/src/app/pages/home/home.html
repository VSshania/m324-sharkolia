<main class="home">
  <div class="characters characters--left">
    <img class="character" src="/characters/wizard-m.png" alt="Male Wizard character" />
    <img class="character" src="/characters/ogre-m.png" alt="Male Ogre character" />
    <img class="character" src="/characters/character-3.png" alt="Placeholder character" />
  </div>

  <section class="content">
    <h1>PERSONIFY</h1>
    <p class="subtitle">Take a short quiz and meet your Pixel "you"</p>
    <p class="description">
      Answer a few questions and figure out which of these characters you are most like.
    </p>
    <button type="button" class="start-button">Start Quiz</button>
  </section>

  <div class="characters characters--right">
    <img class="character" src="/characters/wizard-f.png" alt="Female Wizard character" />
    <img class="character" src="/characters/ogre-f.png" alt="Female Ogre character" />
    <img class="character" src="/characters/character-6.png" alt="Placeholder character" />
  </div>
</main>
